[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=7B0A7C1E4D5F4A6E9C3B2A1D0E8F6C54
ProjectName=Boat Race
ProjectVersion=0.2.0
Description=Four-player armed powerboat racing

[/Script/Engine.GameSession]
; Hard cap enforced by the engine at login. PreLogin checks it too.
MaxPlayers=4

; ===========================================================================
; Everything below can be changed without recompiling. Restart the game to
; pick up a change; all four players must use the same values.
; ===========================================================================

[/Script/BoatRace.BoatRaceGameMode]
TotalLaps=2
; Five start lights come on a second apart, then go out: six seconds.
CountdownSeconds=6.0
ResultsSeconds=25.0
; Once the winner is home, how long the rest have to finish.
FinishGraceSeconds=60.0
; How long a wrecked boat drifts before it is rebuilt at its last gate.
WreckSeconds=4.0
RespawnInvulnerableSeconds=3.0
; Empty grid slots are filled with computer rivals, so a race always has four
; boats. A person who joins takes a rival's seat.
bFillWithRivals=True
; 0.6 gentle .. 1.0 flat out everywhere.
RivalSkill=0.9
; Weather for new races: Sunny, Cloudy, Rainy, Stormy, Windy, Snowy, Foggy,
; Sunset or Night. The host can change it in the lobby with TAB, and
; -Weather=Snowy on the command line overrides this.
Weather=Sunny

[/Script/BoatRace.RaceEnvironment]
; Sea state: 0 glass, 1 the default lively sea (about 1.9 m significant wave
; height), 2 a storm. Each weather multiplies it: sun 0.6, storm 1.45.
; Lower it if the boats are hard to control.
WaveRoughness=1.0
; Raindrops or snowflakes drawn around the camera. Lower on weak graphics.
PrecipitationCount=1400
CrateRespawnSeconds=15.0
CrateTorpedoes=3
CrateMines=2

[/Script/BoatRace.WaterSurface]
; The moving water mesh. 60 x 60 cells of 700 cm covers 420 m around you.
; If the frame rate suffers, drop GridCells to 40 or set UpdateInterval=0.033
; to rebuild the surface 30 times a second instead of every frame.
GridCells=60
CellSize=700.0
UpdateInterval=0.0

[/Script/BoatRace.BoatRaceHUD]
bShowMiniMap=True

[/Script/BoatRace.BoatAudioSubsystem]
; Per machine. M switches the music on and off in game.
MusicVolume=0.45
EffectsVolume=1.0

[/Script/BoatRace.BoatPawn]
; ---- Hull and mass ----
HullMassKg=1200.0
HullLength=700.0
HullWidth=240.0
HullHeight=130.0
Draft=60.0

; ---- Floating ----
; Upward push at full submersion, as a multiple of the boat's weight.
; Higher sits higher and bounces more; below about 1.5 it swamps.
BuoyancyMultiplier=2.6
; 1.0 is critically damped. Lower rides the waves more and settles less.
HeaveDampingRatio=0.65
; How hard the boat slides down the face of a wave. 0 ignores wave slope.
WaveSlopeFactor=1.0

; ---- Engine and handling ----
ThrustAcceleration=1300.0
ReverseFraction=0.4
; Flat-out speed in cm/s. 2900 is about 104 km/h.
ReferenceTopSpeed=2900.0
; How much harder the hull resists sideways movement. Lower slides more.
LateralDragRatio=7.0
; How far the propeller hangs below the keel, cm. Too shallow and it comes out
; of the water at rest and the boat will not pull away.
PropellerDepth=40.0
; Weight the hull carries on its own bow wave at full speed, as a fraction.
; This is what lifts the nose and rides the boat higher the faster it goes.
PlaningLiftFraction=0.35
; Yaw rate at full rudder, degrees per second. Raise if it feels sluggish.
TurnRate=76.0
; How hard the rudder works to reach that rate. Raise for sharper steering.
TurnResponse=4.0
; How far the boat leans into a turn at full speed, degrees, and how quickly.
MaxHeelDegrees=14.0
HeelResponse=6.0
SelfRightAngle=70.0

; ---- Combat ----
MaxHealth=100.0
StartTorpedoes=1
StartMines=1
MaxTorpedoes=5
MaxMines=3
FireCooldownSeconds=0.9

; ---- Boat model ----
; RaceBoat: the Blender boat, painted in each player's colour.
; Higgsfield: the generated SM_Boat.
BoatModel=RaceBoat

; ---- Higgsfield boat model ----
; If the boat drives backwards set CustomMeshYawOffset=180.
; If it floats too high or low, nudge CustomMeshZOffset (cm).
CustomMeshYawOffset=0
CustomMeshZOffset=0
CustomMeshScaleMultiplier=1.0

[/Script/BoatRace.BoatTorpedo]
Speed=5500.0
RangeSeconds=6.0
Damage=60.0
BlastRadius=900.0
BlastImpulse=1100000.0

[/Script/BoatRace.BoatMine]
ArmSeconds=1.2
TriggerRadius=350.0
LifetimeSeconds=45.0
Damage=75.0
BlastRadius=700.0
BlastImpulse=1300000.0

[/Script/BoatRace.WeaponCrate]
PickupRadius=420.0

