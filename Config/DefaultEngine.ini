[/Script/EngineSettings.GameMapsSettings]
; The project ships no .umap of its own. It boots the engine's empty Entry map
; and builds the sea, the circuit and the scenery in C++.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/BoatRace.BoatRaceGameMode
GlobalDefaultServerGameMode=/Script/BoatRace.BoatRaceGameMode

[/Script/Engine.PhysicsSettings]
; Sub-stepping keeps the buoyancy forces stable when the frame rate dips,
; which matters because the hull is held up by four springs.
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6
DefaultGravityZ=-980.0

[/Script/Engine.RendererSettings]
; HIGH preset: Lumen lighting and reflections, so the sea mirrors the sky.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.AutoExposure=True

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

