[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/JetFighter.JetGameMode
GlobalDefaultServerGameMode=/Script/JetFighter.JetGameMode

[/Script/Engine.RendererSettings]
; HIGH preset: Lumen lighting and reflections, so the sea mirrors the sky.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.AutoExposure=True

[ConsoleVariables]
; The engine's driver denylist flags current Mesa on Meteor Lake and stops at
; a pop-up asking to download a Windows driver; the game runs fine on it.
r.WarnOfBadDrivers=0

; ---------------------------------------------------------------------------
; LOW preset for integrated graphics. Appended by Scripts/low_spec.sh, which
; is the supported way to switch: it overrides the values above.
; ---------------------------------------------------------------------------

; ---- BOAT RACE LOW SPEC ----

[SystemSettings]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=0
r.Shadow.Virtual.Enable=0
r.AntiAliasingMethod=1
r.DefaultFeature.MotionBlur=0
r.VolumetricCloud=0
r.VolumetricFog=0
r.ScreenPercentage=70
r.ViewDistanceScale=0.7

[CoreRedirects]
+PackageRedirects=(OldName="/Game/Higgsfield",NewName="/MaritimeCore/Higgsfield",MatchSubstring=true)
+PackageRedirects=(OldName="/Game/Models",NewName="/MaritimeCore/Models",MatchSubstring=true)
+ClassRedirects=(OldName="/Script/BoatRace.WaterSurface",NewName="/Script/MaritimeCore.WaterSurface")
